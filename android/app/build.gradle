plugins {
    id "com.android.application"
}

android {
    namespace "dev.simpleday.widget"
    compileSdk 35

    defaultConfig {
        applicationId "dev.simpleday.widget"
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // personal sideload build
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.work:work-runtime:2.9.1"
}
